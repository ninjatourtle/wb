services:
  db:
    image: postgres:17-alpine
    env_file: .env
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tenderflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: .env
    volumes: [minio_data:/data]
    ports: ["${MINIO_CONSOLE_BIND_ADDRESS:-9001}:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  createbucket:
    image: minio/mc:latest
    depends_on: [minio]
    env_file: .env
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      mc mb --ignore-existing local/$$AWS_STORAGE_BUCKET_NAME; exit 0;"

  web:
    build: .
    env_file: .env
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn tenderhub.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes: [static_data:/app/staticfiles, backup_data:/backups:ro]
    extra_hosts:
      - "host.docker.internal:${POSTFIX_RELAY_HOST_IP:-172.18.0.1}"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request = urllib.request.Request('http://localhost:8000/health/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: celery -A tenderhub worker -l info
    extra_hosts:
      - "host.docker.internal:${POSTFIX_RELAY_HOST_IP:-172.18.0.1}"
    depends_on:
      web: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  beat:
    build: .
    env_file: .env
    command: celery -A tenderhub beat -l info
    depends_on:
      web: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["${WEB_BIND_ADDRESS:-8000}:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped

  backup:
    image: postgres:17-alpine
    env_file: .env
    command: >
      sh -c 'while true; do
      PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -Fc
      > /backups/tenderflow-$$(date +%Y%m%d-%H%M%S).dump;
      date -Iseconds > /backups/last-success.txt;
      find /backups -type f -mtime +7 -delete;
      sleep 86400;
      done'
    volumes:
      - backup_data:/backups
      - ./scripts:/scripts:ro
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  static_data:
  backup_data:

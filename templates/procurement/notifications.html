{% extends "base.html" %}{% block title %}Уведомления · TenderFlow{% endblock %}{% block content %}<section class="page-hero compact"><div class="container"><span>Центр событий</span><h1>Уведомления</h1></div></section><section class="section container narrow"><div class="panel">{% for item in notifications %}<a class="notification large" href="{{ item.url|default:'#' }}"><b>{{ item.title }}</b><span>{{ item.message }}</span><small>{{ item.created_at|date:"d.m.Y H:i" }}</small></a>{% empty %}<div class="empty">Уведомлений пока нет.</div>{% endfor %}</div></section>{% endblock %}

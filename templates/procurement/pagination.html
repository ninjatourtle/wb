{% if page_obj.has_other_pages %}<nav class="pagination">{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}{% if pagination_query %}&{{ pagination_query }}{% else %}&q={{ query|default:'' }}&category={{ category|default:'' }}&procedure={{ procedure|default:'' }}{% endif %}">← Назад</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}{% if pagination_query %}&{{ pagination_query }}{% else %}&q={{ query|default:'' }}&category={{ category|default:'' }}&procedure={{ procedure|default:'' }}{% endif %}">Далее →</a>{% endif %}</nav>{% endif %}

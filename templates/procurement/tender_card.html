<a class="tender-card" href="{{ tender.get_absolute_url }}"><div class="card-top"><span class="pill">{{ tender.get_procedure_display }}</span><span class="number">{{ tender.number }}</span></div><h3>{{ tender.title }}</h3><p>{{ tender.description|truncatewords:18 }}</p><div class="price"><small>Начальная цена</small><strong>{{ tender.budget|floatformat:0 }} ₽</strong></div><div class="card-bottom"><span>{{ tender.get_category_display }}</span><b>до {{ tender.deadline|date:"d.m.Y" }}</b></div></a>
